services:
  postgres:
    image: postgres:16-alpine
    container_name: bcw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_card_wizard}
      POSTGRES_USER: ${POSTGRES_USER:-bcw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - bcw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcw_user} -d ${POSTGRES_DB:-business_card_wizard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: business-card-wizard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bcw_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-business_card_wizard}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    labels:
      traefik.enable: "true"
      traefik.http.routers.business-card-wizard.entrypoints: websecure
      traefik.http.routers.business-card-wizard.rule: Host(`business-card-wizard.srv1766569.hstgr.cloud`)
      traefik.http.routers.business-card-wizard.tls.certresolver: letsencrypt
      traefik.http.services.business-card-wizard.loadbalancer.server.port: "3000"
    ports:
      - "127.0.0.1:3007:3000"

volumes:
  bcw-postgres-data:
